<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>oooh my dog! — Hundetraining mit System. Vor Ort, 24/7 und für Profis.</title>
  <meta name="description" content="Premium-Hundetraining aus Mülheim: lokal im Ruhrgebiet, digital im gesamten deutschsprachigen Raum (24/7) und als Pro & Business für Hundeschulen. Klarheit statt Chaos." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/Nav.jsx"></script>
  <script type="text/babel" src="components/Hero.jsx"></script>
  <script type="text/babel" src="components/Pillars.jsx"></script>
  <script type="text/babel" src="components/Audience.jsx"></script>
  <script type="text/babel" src="components/Method.jsx"></script>
  <script type="text/babel" src="components/Offers.jsx"></script>
  <script type="text/babel" src="components/Anywhere.jsx"></script>
  <script type="text/babel" src="components/Pro.jsx"></script>
  <script type="text/babel" src="components/Finder.jsx"></script>
  <script type="text/babel" src="components/Proof.jsx"></script>
  <script type="text/babel" src="components/Jenny.jsx"></script>
  <script type="text/babel" src="components/FAQ.jsx"></script>
  <script type="text/babel" src="components/Legal.jsx"></script>
  <script type="text/babel" src="components/Footer.jsx"></script>
  <script type="text/babel" src="components/Selector.jsx"></script>

  <script type="text/babel">
    function App() {
      const [selectorOpen, setSelectorOpen] = React.useState(false);
      const openSelector = () => setSelectorOpen(true);

      return (
        <>
          <Nav onOpenSelector={openSelector} />
          <Hero onOpenSelector={openSelector} />
          <Pillars />
          <Audience />
          <Method />
          <Offers onOpenSelector={openSelector} />
          <Anywhere onOpenSelector={openSelector} />
          <Pro />
          <Finder onOpenSelector={openSelector} />
          <Proof />
          <Jenny />
          <FAQ />
          <FinalCTA onOpenSelector={openSelector} />
          <Footer />
          <Selector open={selectorOpen} onClose={() => setSelectorOpen(false)} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
